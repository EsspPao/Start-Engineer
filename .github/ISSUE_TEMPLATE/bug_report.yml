name: Bug 报告
description: 报告可复现的功能、界面或兼容性问题
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿上传包含个人路径、应用列表或敏感数据的配置文件。
  - type: input
    id: version
    attributes:
      label: Start Engineer 版本
      placeholder: 例如 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本与架构
      placeholder: 例如 Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: 1. 打开… 2. 点击… 3. 出现…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 诊断信息
      description: 可从“设置 → 关于与诊断”复制；发送前检查数据目录路径。
      render: text
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 我使用的是本仓库 Releases 提供的版本
          required: true
        - label: 我已移除截图和日志中的敏感信息
          required: true
