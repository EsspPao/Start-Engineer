name: Build draft release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - run: npm ci
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json).version
          $expected = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }
      - run: npm run release:verify
      - name: Package Windows artifacts
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:CSC_LINK) {
            npm run package:win:artifacts:signed
          } else {
            npm run package:win:artifacts
          }
      - run: npm run release:checksums
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: start-engineer-${{ github.run_id }}-windows-x64
          if-no-files-found: error
          path: |
            release/Start-Engineer-Setup-*.exe
            release/Start-Engineer-Portable-*.exe
            release/SHA256SUMS.txt

  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: start-engineer-${{ github.run_id }}-windows-x64
          path: release
      - name: Create draft GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            Get-ChildItem -LiteralPath "release" -Filter "Start-Engineer-Setup-*.exe" -File
            Get-ChildItem -LiteralPath "release" -Filter "Start-Engineer-Portable-*.exe" -File
            Get-Item -LiteralPath "release/SHA256SUMS.txt"
          ) | ForEach-Object { $_.FullName }
          if ($assets.Count -ne 3) {
            throw "Expected exactly Setup, Portable and SHA256SUMS assets; found $($assets.Count)."
          }
          $releaseArgs = @(
            "release", "create", $env:GITHUB_REF_NAME
          ) + $assets + @(
            "--draft",
            "--generate-notes",
            "--verify-tag",
            "--title", "Start Engineer $env:GITHUB_REF_NAME"
          )
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE."
          }
